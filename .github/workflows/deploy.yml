name: Deploy (hosting · Firestore rules · indexes · storage rules)

# Deploys the static site and the Firestore security surface only.
#
# Cloud Functions are deliberately excluded: they need Blaze. Adding them later
# means `npm ci --prefix functions`, `npm --prefix functions run build` and
# `functions` in the --only list (see AUDIT-gym-management-system.md).
#
# FOUR GATES RUN BEFORE ANYTHING IS DEPLOYED
#   1. Green CI — a completed, successful run of ci.yml for this exact commit.
#   2. Deploy credential — FIREBASE_SERVICE_ACCOUNT must exist.
#   3. Index diff (only when indexes are in scope) — `firebase deploy --only
#      firestore:indexes` DELETES every composite index that exists in the
#      project but is absent from firestore.indexes.json, including ones created
#      in the console. scripts/index-diff.mjs prints what would be created and
#      deleted, and fails the run when deletions were not confirmed.
#   4. Firebase web config - all six VITE_FIREBASE_* secrets must be set.
#      scripts/check-firebase-env.mjs fails the job before the build, because a
#      build without them inlines `apiKey: void 0` and the smoke check can only
#      catch that after the broken bundle is already on Hosting.
#
# STAGED SCOPE (deploy_scope input). The security surface and the hosting bundle
# carry different risks, so they ship as separate, reviewable steps:
#   hosting                  — new bundle only; rules and indexes untouched.
#   hosting+indexes          — adds firestore:indexes, skipping rules.
#   hosting+rules            — adds firestore:rules (what the app may read/write).
#   hosting+rules+indexes    — adds firestore:indexes, the only destructive step.
# The safe order for a project whose live release predates the repository is
# hosting → rules → indexes, each reviewed on its own.
#
# RULES CAN BE SKIPPED (deploy_scope hosting+indexes). The rules step needs
# serviceusage.services.get for the deploy service account, which the project
# has not granted yet; hosting+indexes lets the reviewed index diff and deploy run
# while that permission is outstanding. It is the same code path as
# hosting+rules+indexes with the rules step's `contains(..., 'rules')` condition
# false, so nothing about the rules deploy changes when it is eventually used.
#
# STORAGE RULES ARE OPT-IN (deploy_storage_rules input, off by default).
# storage.rules has never been deployed, so production Storage still runs the
# default deny-all ruleset and member photos / gym logos cannot be uploaded or
# read. The step is wired here so it ships from the same reviewed pipeline, but
# it stays off until storage is ready to be exercised: mismatched Storage rules
# only surface at upload/read time, not at deploy time.
#
# A RULES DEPLOY PROVES ITSELF. `firebase deploy --only firestore:rules` can report
# success while the live `cloud.firestore` release still points at an older ruleset,
# and nothing else checks production: the emulator suites prove what the file WOULD
# enforce, not what the project DOES. After the rules step,
# scripts/check-live-rules.mjs reads the release back and compares its ruleset with
# `firestore.rules` (two GET requests, nothing written). Exit 0 = match, 1 = differs,
# 2 = could not read; every outcome other than 0 fails the job, so a rules run that
# cannot show what it published is red instead of green.
#
# AFTER THE HOSTING STEP, scripts/smoke-hosting.mjs checks the live URL against
# the bundle that was just built: the build must carry the Firebase web config
# (no `apiKey: void 0`), the served index.html must reference the same entry
# hashes, the entry bytes must match (sha256), and a deep link must serve the app
# through the SPA rewrite. A release that did not publish, or publishes a
# truncated bundle, fails the job before rules or indexes move.
#
# PHASE 1 (current): workflow_dispatch only. PHASE 2: uncomment the push trigger
# to auto-deploy on main; every gate above still applies.

on:
  workflow_dispatch:
    inputs:
      deploy_scope:
        description: 'What to deploy (hosting first, then rules, then indexes)'
        type: choice
        default: hosting
        options:
          - hosting
          - hosting+indexes
          - hosting+rules
          - hosting+rules+indexes
      confirm_index_deletions:
        description: 'Deploy even though indexes will be DELETED (check the diff summary first)'
        type: boolean
        default: false
      deploy_storage_rules:
        description: 'Also deploy storage.rules (photos/logos; off until storage is in use)'
        type: boolean
        default: false
  # PHASE 2 — enable after the first reviewed index deploy:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # read CI run conclusions for the deployed commit

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'himalye-wonders-gym' }}

jobs:
  deploy:
    name: Firebase deploy (${{ inputs.deploy_scope || 'hosting' }})
    runs-on: ubuntu-latest
    env:
      # The Firebase web config, inlined by Vite at build time. Public by design
      # - these values end up in the bundle - so they live in repository secrets
      # and the job refuses to build when one is empty (see the check below).
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      # Gate 1. Any completed green run of CI for this commit passes, so a later
      # cancelled duplicate run cannot block an otherwise tested commit.
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RUNS="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100"
          GREEN=$(gh api "$RUNS" --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')
          if [ "$GREEN" -lt 1 ]; then
            echo "CI runs for ${SHA}: $(gh api "$RUNS" --jq '[.workflow_runs[] | "\(.status)/\(.conclusion // "-")"] | join(", ") | if . == "" then "none" else . end')"
            echo "::error::No successful CI run for ${SHA}. Deploy only runs on a commit whose CI is green."
            exit 1
          fi
          echo "CI is green for ${SHA}."

      - name: Check deploy credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set. Add the service-account key JSON (see AUDIT-gym-management-system.md)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Gate 3. Read-only, and only when indexes are part of the run, because
      # only that step can delete anything.
      #
      # The token comes from gcloud rather than the auth action's access_token
      # output: that output needs iamcredentials.googleapis.com enabled in the
      # project, and the runner already has the credentials file the action
      # wrote (CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE), so gcloud signs the same
      # service-account assertion and exchanges it for a token without that API.
      - name: Index diff (before deploy)
        if: contains(inputs.deploy_scope, 'indexes')
        env:
          CONFIRM_INDEX_DELETIONS: ${{ inputs.confirm_index_deletions }}
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          node scripts/index-diff.mjs --project="$PROJECT_ID" --access-token="$ACCESS_TOKEN"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Gate 4. Vite inlines the config at build time, so an empty secret is
      # invisible until the bundle is built - and in this workflow the bundle is
      # on Hosting before the smoke check can refuse it. Fail here, before
      # install and build, and name the secret that is missing.
      - name: Check Firebase web config
        run: node scripts/check-firebase-env.mjs

      - name: Install
        run: npm ci

      # The Firebase web config is baked into the bundle at build time: Vite
      # inlines every VITE_FIREBASE_* variable it finds in the environment, so a
      # build without them ships `apiKey: void 0` and every user sees "Firebase is
      # not configured" on the login page. The job-level env above supplies the
      # six values from repository secrets, Gate 4 refuses the run when one is
      # empty, and scripts/smoke-hosting.mjs fails it if the bundle that came out
      # carries no Firebase api key.
      - name: Build hosting bundle
        run: npm run build

      # Step 1 of the staged scope: the bundle only. Rules stay as they are, so a
      # bundle that turns out to be wrong can be rolled back without touching the
      # security surface.
      - name: Deploy hosting
        run: |
          npx --yes firebase-tools@15 deploy \
            --only hosting \
            --project "$PROJECT_ID" \
            --non-interactive

      # Step 1b: the deploy command can succeed while the live origin still serves
      # the previous bundle. Compare the live URL with the build that was just
      # produced, so a stale or broken bundle fails here instead of going live
      # silently and taking the next stage with it.
      - name: Smoke check the live hosting URL
        env:
          HOSTING_URL: ${{ vars.FIREBASE_HOSTING_URL || format('https://{0}.web.app', env.PROJECT_ID) }}
        run: node scripts/smoke-hosting.mjs --base-url="$HOSTING_URL" --dist=dist

      # Step 2: the security surface. Only after the hosting bundle is verified
      # against the live project. Skipped by deploy_scope hosting+indexes.
      - name: Deploy Firestore rules
        if: contains(inputs.deploy_scope, 'rules')
        run: |
          npx --yes firebase-tools@15 deploy \
            --only firestore:rules \
            --project "$PROJECT_ID" \
            --non-interactive

      # Step 2c: prove the release. The deploy command only says the upload was
      # accepted; this reads the live release back and compares it with the file that
      # was just deployed. A mismatch is retried for ~40 s (a read can briefly trail
      # the write), then fails the job. Exit 2 ("could not check": token, permission,
      # network) is not retried — the deploy is unproven either way.
      - name: Verify the live rules match firestore.rules
        if: contains(inputs.deploy_scope, 'rules')
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          for attempt in 1 2 3 4 5; do
            status=0
            node scripts/check-live-rules.mjs               --project="$PROJECT_ID"               --access-token="$ACCESS_TOKEN" || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 1 ]; then
              echo "::error::Live rules verification could not run (exit ${status})."
              exit "$status"
            fi
            echo "Attempt ${attempt}/5: the live ruleset still differs; retrying in 10s."
            sleep 10
          done
          echo "::error::firestore.rules was deployed but production still enforces a different ruleset."
          exit 1

      # Step 2b: Storage rules for member photos and gym logos. Opt-in.
      #
      # This project has no default Cloud Storage bucket: creating one needs a
      # billing plan it does not have, which is exactly why photos and logos are
      # base64 thumbnails in Firestore (src/services/photoStore.js) and nothing
      # in the client talks to Storage. `firebase deploy --only storage` resolves
      # the default bucket first and dies with a 403 on
      # firebasestorage.defaultBucket.get, which used to mark the whole run red
      # even though hosting and firestore.rules had already shipped.
      #
      # So: probe for the bucket, and when there is none say so and skip. When a
      # bucket does exist the deploy still runs and still fails loudly if the
      # rules are rejected.
      - name: Deploy Storage rules
        if: inputs.deploy_storage_rules
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          bucket_status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebasestorage.googleapis.com/v1alpha/projects/$PROJECT_ID/defaultBucket")
          if [ "$bucket_status" != "200" ]; then
            echo "::notice::Skipping storage.rules: $PROJECT_ID has no default Cloud Storage bucket (HTTP $bucket_status). Member photos and the gym logo are Firestore thumbnails, so no Storage rule is in effect or needed."
            exit 0
          fi
          npx --yes firebase-tools@15 deploy \
            --only storage \
            --project "$PROJECT_ID" \
            --non-interactive

      # Step 3: the destructive step. `firestore:indexes` makes the file the
      # source of truth: indexes that exist in the project but not in the file are
      # deleted, which firebase-tools only does with --force. Gate 3 has already
      # refused the run unless the deletions were confirmed, so --force here
      # cannot delete an unreviewed index.
      #
      # --config points at a minimal config that names only the indexes file.
      # With firebase.json, firebase-tools compiles firestore.rules before it
      # touches indexes (`firebaserules.googleapis.com:test`), and the deploy
      # service account gets 403 there — the same missing permission that blocks
      # the rules step. Leaving rules out of this config keeps the index deploy
      # about indexes only.
      - name: Deploy Firestore indexes
        if: contains(inputs.deploy_scope, 'indexes')
        run: |
          npx --yes firebase-tools@15 deploy \
            --only firestore:indexes \
            --config firebase.indexes.json \
            --force \
            --project "$PROJECT_ID" \
            --non-interactive
