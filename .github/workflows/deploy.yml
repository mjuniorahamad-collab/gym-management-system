name: Deploy (hosting · Firestore rules · indexes)

# Deploys the static site and the Firestore security surface only.
#
# Cloud Functions are deliberately excluded: they need Blaze. Adding them later
# means `npm ci --prefix functions`, `npm --prefix functions run build` and
# `functions` in the --only list (see AUDIT-gym-management-system.md).
#
# THREE GATES RUN BEFORE ANYTHING IS DEPLOYED
#   1. Green CI — a completed, successful run of ci.yml for this exact commit.
#   2. Deploy credential — FIREBASE_SERVICE_ACCOUNT must exist.
#   3. Index diff (only when indexes are in scope) — `firebase deploy --only
#      firestore:indexes` DELETES every composite index that exists in the
#      project but is absent from firestore.indexes.json, including ones created
#      in the console. scripts/index-diff.mjs prints what would be created and
#      deleted, and fails the run when deletions were not confirmed.
#
# STAGED SCOPE (deploy_scope input). The security surface and the hosting bundle
# carry different risks, so they ship as separate, reviewable steps:
#   hosting                  — new bundle only; rules and indexes untouched.
#   hosting+rules            — adds firestore:rules (what the app may read/write).
#   hosting+rules+indexes    — adds firestore:indexes, the only destructive step.
# The safe order for a project whose live release predates the repository is
# hosting → rules → indexes, each reviewed on its own.
#
# PHASE 1 (current): workflow_dispatch only. PHASE 2: uncomment the push trigger
# to auto-deploy on main; every gate above still applies.

on:
  workflow_dispatch:
    inputs:
      deploy_scope:
        description: 'What to deploy (hosting first, then rules, then indexes)'
        type: choice
        default: hosting
        options:
          - hosting
          - hosting+rules
          - hosting+rules+indexes
      confirm_index_deletions:
        description: 'Deploy even though indexes will be DELETED (check the diff summary first)'
        type: boolean
        default: false
  # PHASE 2 — enable after the first reviewed index deploy:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # read CI run conclusions for the deployed commit

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'himalye-wonders-gym' }}

jobs:
  deploy:
    name: Firebase deploy (${{ inputs.deploy_scope || 'hosting' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gate 1. Any completed green run of CI for this commit passes, so a later
      # cancelled duplicate run cannot block an otherwise tested commit.
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RUNS="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100"
          GREEN=$(gh api "$RUNS" --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')
          if [ "$GREEN" -lt 1 ]; then
            echo "CI runs for ${SHA}: $(gh api "$RUNS" --jq '[.workflow_runs[] | "\(.status)/\(.conclusion // "-")"] | join(", ") | if . == "" then "none" else . end')"
            echo "::error::No successful CI run for ${SHA}. Deploy only runs on a commit whose CI is green."
            exit 1
          fi
          echo "CI is green for ${SHA}."

      - name: Check deploy credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set. Add the service-account key JSON (see AUDIT-gym-management-system.md)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Gate 3. Read-only, and only when indexes are part of the run, because
      # only that step can delete anything.
      - name: Index diff (before deploy)
        if: contains(inputs.deploy_scope, 'indexes')
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONFIRM_INDEX_DELETIONS: ${{ inputs.confirm_index_deletions }}
        run: node scripts/index-diff.mjs --project="$PROJECT_ID" --access-token="$ACCESS_TOKEN"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build hosting bundle
        run: npm run build

      # Step 1 of the staged scope: the bundle only. Rules stay as they are, so a
      # bundle that turns out to be wrong can be rolled back without touching the
      # security surface.
      - name: Deploy hosting
        run: |
          npx --yes firebase-tools@15 deploy \
            --only hosting \
            --project "$PROJECT_ID" \
            --non-interactive

      # Step 2: the security surface. Only after the hosting bundle is verified
      # against the live project.
      - name: Deploy Firestore rules
        if: contains(inputs.deploy_scope, 'rules')
        run: |
          npx --yes firebase-tools@15 deploy \
            --only firestore:rules \
            --project "$PROJECT_ID" \
            --non-interactive

      # Step 3: the destructive step. `firestore:indexes` makes the file the
      # source of truth, so any project index missing from it is deleted.
      - name: Deploy Firestore indexes
        if: contains(inputs.deploy_scope, 'indexes')
        run: |
          npx --yes firebase-tools@15 deploy \
            --only firestore:indexes \
            --project "$PROJECT_ID" \
            --non-interactive
