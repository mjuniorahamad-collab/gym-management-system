name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint · build · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit + component tests
        run: npm test -- --reporter=dot

  rules:
    name: Security rules · storage · functions (emulator)
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The Firestore and Storage emulators are JVM binaries. firebase-tools
      # 15.x refuses to start them on anything below Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install app dependencies
        run: npm ci

      # functions/test/* imports the real projection modules, which need
      # firebase-admin from functions/node_modules.
      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15

      # GATING suites. The two frozen baselines are excluded from them (see
      # vitest.emulator.js / vitest.storage.js) and run in the `baseline` job.
      - name: Firestore rules suite
        run: npm run test:rules

      - name: Storage rules suite
        run: npm run test:storage

      - name: Projection writer suite (Admin SDK)
        run: npm run test:functions

  # Frozen historical baselines. They are expected to be red by design, so this
  # job reports (continue-on-error) instead of gating: the pipeline's verdict is
  # decided by `app` and `rules`, and a regression in the live suites can no
  # longer hide behind a permanently red baseline.
  baseline:
    name: Frozen baselines (informational, non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install app dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15

      # Phase 0.5A vulnerable Firestore baseline (26 known-red assertions).
      - name: Frozen Firestore baseline
        run: npm run test:rules:frozen

      # Pre-Phase-3A Storage baseline (32 known-red assertions).
      - name: Frozen Storage baseline
        run: npm run test:storage:frozen
