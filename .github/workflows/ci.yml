name: CI

on:
  # `pull_request` covers every feature branch. The `push` trigger is bound to main
  # on purpose, for two reasons:
  #   1. A branch that is pushed and then opened as a PR used to run this workflow
  #      twice on the same commit (push + pull_request) — identical work, doubled
  #      minutes, two check suites for one review.
  #   2. The merge commit on main needs its own run anyway: deploy.yml's Gate 1 asks
  #      for a green ci.yml run for the exact commit being deployed, and a squash
  #      merge produces a commit the PR's run never tested.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint · build · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit + component tests
        run: npm test -- --reporter=dot

  rules:
    name: Security rules · storage · functions (emulator)
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The Firestore and Storage emulators are JVM binaries. firebase-tools
      # 15.x refuses to start them on anything below Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install app dependencies
        run: npm ci

      # functions/test/* imports the real projection modules, which need
      # firebase-admin from functions/node_modules.
      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15

      # GATING suites. The two frozen baselines are excluded from them (see
      # vitest.emulator.js / vitest.storage.js) and run in the `baseline` job.
      - name: Firestore rules suite
        run: npm run test:rules

      - name: Storage rules suite
        run: npm run test:storage

      - name: Projection writer suite (Admin SDK)
        run: npm run test:functions

  # Frozen historical baselines. The two archived files are red by design, so the
  # job does not tolerate their failures blindly: scripts/assert-frozen-baseline.mjs
  # compares the archived file's own counts with the documented ones (27 failed /
  # 380 passed Firestore, 32 failed / 18 passed Storage). Matching counts keep the
  # job green; any drift — an edited assertion, a test that stopped being
  # collected, rules that moved — turns it red. The gating `app` and `rules` jobs
  # stay independent of it.
  baseline:
    name: Frozen baselines (expected counts asserted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install app dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15

      # Phase 0.5A vulnerable Firestore baseline: runs the suite, then asserts the
      # archived file still fails 27 and passes 380.
      - name: Frozen Firestore baseline
        run: npm run test:rules:frozen

      # Pre-Phase-3A Storage baseline: asserts the archived file still fails 32 and
      # passes 18. This step also runs when the Firestore counts drifted, so both
      # baselines report in the same run.
      - name: Frozen Storage baseline
        if: always()
        run: npm run test:storage:frozen
